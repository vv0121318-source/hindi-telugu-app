function near(q,t){if(!q||!t)return 99;if(q==t)return 0;var d=lev(q,t),lim=q.length<=3?0:q.length==4?1:2;return d<=lim?d:99;}

function roman(t,hin){
  var V=hin?HV:TV,M=hin?HM:TM,C=hin?HC:TC,vir=hin?"\u094D":"\u0C4D";

function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function toNative(text,hin){
  var itc=hin?"hi-t-i0-und":"te-t-i0-und";
  return Promise.all(text.split(/\s+/).map(function(w){
    return fetch("https://inputtools.google.com/request?text="+encodeURIComponent(w)+"&itc="+itc+"&num=1&cp=0&cs=1&ie=utf-8&oe=utf-8&app=demopage")
      .then(function(r){return r.json()}).then(function(j){return j[0]=="SUCCESS"?j[1][0][1][0]:w}).catch(function(){return w});
  })).then(function(a){return a.join(" ")});
}
function tr(text,sl,tl){

    .then(function(r){return r.json()}).then(function(d){return d[0].map(function(x){return x[0]}).join("")})
    .catch(function(){return fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+sl+"|"+tl)

}

      h+='<div class="n">'+esc(out)+'</div>';
    }else{
      h+='<div class="n">'+esc(out)+'</div><div class="r">'+esc(roman(out,tl=="hi"))+'</div><button id="spk" style="margin-top:8px">&#128266; Speak</button>';
    }
    res.innerHTML='<div class="rs">'+h+'</div>';
  })}).catch(function(){res.innerHTML='<div class="rs">Could not reach the translator. Check your internet. The phrasebook below still works offline.</div>';});
}
document.getElementById("res").onclick=function(e){
  if(e.target.id=="spk"&&window.speechSynthesis){var u=new SpeechSynthesisUtterance(last);u.lang=lastTl=="hi"?"hi-IN":"te-IN";speechSynthesis.cancel();speechSynthesis.speak(u);}
};
document.getElementById("go").onclick=run;
document.getElementById("src").onkeydown=function(e){if(e.key=="Enter"&&!e.shiftKey){e.preventDefault();run();}};
st.dir="en-hi";
function dirBtns(){var it=[["en-hi","English &rarr; Hindi"],["en-te","English &rarr; Telugu"],["hi-en","Hindi &rarr; English"],["te-en","Telugu &rarr; English"]];
  var el=document.getElementById("dirs");el.innerHTML=it.map(function(i){return '<button data-v="'+i[0]+'" class="'+(st.dir==i[0]?'on':'')+'">'+i[1]+'</button>'}).join("");
  el.onclick=function(e){var v=e.target.getAttribute("data-v");if(v){st.dir=v;dirBtns();run();}};}
dirBtns();
btns("langs",[["both","Both"],["hi","Hindi"],["te","Telugu"]],"lang");
btns("cats",[["all","All"],["B","Basics"],["W","Work"],["C","Customer"],["D","Daily"]],"cat");
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("service-worker.js").catch(function(){});});}
